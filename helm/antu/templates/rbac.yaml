# Kept for the Camel-removal release only.
#
# The version being replaced elects its leader through a Kubernetes ConfigMap, and helm applies this chart
# before the first pod is replaced: deleting the Role here takes leadership renewal away from the old pods
# while they are still serving, and any old pod that restarts during the rollout cannot start its routes.
# The new code calls no Kubernetes API at all, so these grants are inert to it.
#
# Delete this file in a follow-up release, together with the two unused PubSub topics in terraform.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: antu-service-account
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "common.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: antu-service-account
subjects:
  - kind: ServiceAccount
    name: application
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: antu-service-account
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "common.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "endpoints"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["antu-leaders"]
    verbs: ["get", "watch", "list", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["antu-leaders-lockonantureportaggregationqueue", "antu-leaders-lockonanturefreshstopcacheperiodically", "antu-leaders-lockonanturefreshstopcacheatstartup", "antu-leaders-lockonantucommonfilesaggregationqueue", "antu-leaders-lockonanturefreshorganisationaliascacheperiodically"]
    verbs: ["get", "update", "list"]
  - apiGroups: ["apps"]
    resources: [ "deployments" ]
    verbs: [ "get", "list", "watch", "update", "patch" ]
