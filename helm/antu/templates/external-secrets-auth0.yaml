# Two client registrations share one Secret Manager key, which the common chart's secrets map cannot
# express (secretKey is always the remote key there).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth0
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "antu.labels" . | nindent 4 }}
  annotations:
    # Changes every deploy so ESO resyncs then, as the chart does for its own secrets.
    timestamp: {{ now | date "2006-01-02T15:04:05" }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Namespace }}
  target:
    name: auth0
    creationPolicy: Owner
  data:
  - secretKey: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_INTERNAL_CLIENT_SECRET
    remoteRef:
      key: MNG_AUTH0_INT_CLIENT_SECRET
  - secretKey: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_SOBEK_CLIENT_SECRET
    remoteRef:
      key: MNG_AUTH0_INT_CLIENT_SECRET
