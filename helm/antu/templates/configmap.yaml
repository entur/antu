apiVersion: v1
data:
  application.properties: |+

    # Spring
    spring.main.sources=no.entur.antu
    spring.profiles.active=gcs-blobstore,stop-place-changelog
    server.port={{ .Values.service.http.internalPort }}

    # Compress responses when the caller asks for it. Validation reports are JSON in the hundreds of
    # kilobytes and compress by roughly a factor of ten. The container sets Content-Encoding itself, so
    # unlike the header this replaces it is always true. See ValidationReportController.
    server.compression.enabled=true
    server.compression.mime-types=application/json,text/plain
    server.compression.min-response-size=2KB

    # Job queue
    # How many validations one pod runs at a time. Each holds a whole NeTEx file in heap, so this is
    # what bounds memory; scale out on pods first.
    #
    # Two settings are needed, because the number of Subscribers and the number of threads that deliver
    # to them are separate. The Subscriber count alone does not bound concurrency: callbacks run on a
    # scheduler whose default is 4 threads, so leaving executor-threads unset lets one pod start four
    # validations regardless of this value. They are set per subscription rather than globally so that a
    # long validation cannot stop new validation requests from being accepted on the other subscription.
    antu.netex.job.consumers={{ .Values.jobConsumers }}
    spring.cloud.gcp.pubsub.subscription.AntuJobQueue.executor-threads={{ .Values.jobConsumers }}
    # Lease no more messages than can be worked on. The gax default is 1000, and an idle lease still
    # counts against the undelivered-message metric the HPA scales on.
    spring.cloud.gcp.pubsub.subscription.AntuJobQueue.flow-control.max-outstanding-element-count={{ .Values.jobConsumers }}
    spring.cloud.gcp.pubsub.subscription.AntuNetexValidationQueue.executor-threads=1
    # Without this the gax default of 1000 applies, so one pod leases a whole nightly batch of requests and
    # works through them one at a time while the other pods have nothing to do.
    spring.cloud.gcp.pubsub.subscription.AntuNetexValidationQueue.flow-control.max-outstanding-element-count=1

    # Load-bearing for antu.shutdown.drain.timeout.seconds. The publisher's thread pool stops accepting work
    # on ContextClosedEvent by default, and that event fires before the drain runs, so a validation would
    # finish draining and then fail to publish its next job or its terminal status: the nack and the
    # revalidation the drain exists to avoid, plus a delayed shutdown to pay for it.
    spring.cloud.gcp.pubsub.publisher.executor-accept-tasks-after-context-close=true
    # Topics and subscriptions are terraformed, so the pods must not try to create them.
    entur.pubsub.subscriber.autocreate=false
    # Slept inline on the callback thread after a nack, so with one job thread per pod this is how long the
    # pod stops validating. The subscription's own retry_policy.minimum_backoff already spaces redeliveries.
    entur.pubsub.consumer.retry.delay=1000

    # Give up on a validation that has made no progress for this long, notify the client with the timeout
    # status and release its Redis state. Replaces the Camel aggregator's completionTimeout, which was the
    # only thing guaranteeing that a STARTED is always followed by a terminal status.
    antu.validation.stalled.after.millis=1800000
    antu.validation.sweep.millis=300000

    # On shutdown, finish the files being validated right now instead of letting them be redelivered and
    # revalidated elsewhere. The HPA scales antu down routinely, so this is a normal path, and XSD
    # validation is expensive enough that the retries add up.
    #
    # Sized against terminationGracePeriodSeconds=180, but the drain does not get all of it. The
    # ContextClosedEvent listener in AbstractEnturGooglePubSubConsumer runs first and calls
    # stopAsync().awaitTerminated(10, SECONDS) per Subscriber, and for the Subscriber holding the
    # in-flight file that wait always expires, because gax will not terminate while a callback is
    # running. So the budget is roughly 10 s per busy subscriber, then this, then bean destruction.
    # At 175 the total overran the grace period and SIGKILL cut off the very file the drain was holding
    # the pod open for. 150 leaves headroom for both consumers plus shutdown.
    antu.shutdown.drain.timeout.seconds=150

    # One thread per @Scheduled method: the leader heartbeat, the two cache refresh triggers, and the
    # stalled-validation sweep. The last three all do blocking Redis or PubSub work and can coincide, so
    # anything less than four lets them starve the heartbeat and drop the lease while this pod is healthy.
    spring.task.scheduling.pool.size=4

    # Agreement registry
    antu.organisation.refresh.millis=1800000
    antu.agreement.registry.url={{ .Values.agreementRegistryUrl }}

    # Stop place dataset import
    # Refresh stop place cache at 01:00 and 14:00 every day
    # Unquoted on purpose: this renders into a properties file, where quotes would become part of
    # the value and the cron parser would reject it at startup.
    antu.stop.refresh.cron={{ .Values.stopPlaceCacheRefreshCron }}

    # Stop place changelog
    org.rutebanken.helper.stopplace.changelog.enabled=true
    org.rutebanken.helper.stopplace.changelog.kafka.autostartup=false
    org.rutebanken.helper.stopplace.changelog.kafka.bootstrap-servers={{ .Values.kafka.brokers }}
    org.rutebanken.helper.stopplace.changelog.kafka.schema-registry-url={{ .Values.kafka.registry }}
    org.rutebanken.helper.stopplace.changelog.kafka.topic={{ .Values.kafka.changelogTopic }}
    org.rutebanken.helper.stopplace.changelog.kafka.security-protocol=SASL_SSL
    org.rutebanken.helper.stopplace.changelog.kafka.sasl-mechanism=SCRAM-SHA-512
    org.rutebanken.helper.stopplace.changelog.kafka.sasl-jaas-config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKAUSERNAME}" password="${KAFKAPASSWORD}";
    org.rutebanken.helper.stopplace.changelog.kafka.schema-registry-basic-auth-user-info=${KAFKAUSERNAME}:${KAFKAPASSWORD}
    org.rutebanken.helper.stopplace.changelog.repository.url={{ .Values.tiamatUrl }}
    org.rutebanken.helper.stopplace.changelog.repository.etClientName=entur-antu
    org.rutebanken.helper.stopplace.changelog.repository.allVersions=false
    org.rutebanken.helper.stopplace.changelog.repository.topographicPlaceExportMode=NONE
    org.rutebanken.helper.stopplace.changelog.repository.tariffZoneExportMode=NONE
    org.rutebanken.helper.stopplace.changelog.repository.groupOfTariffZonesExportMode=NONE
    org.rutebanken.helper.stopplace.changelog.repository.fareZoneExportMode=NONE
    org.rutebanken.helper.stopplace.changelog.repository.groupOfStopPlacesExportMode=NONE



    # Validators
    antu.netex.validation.schema.skip=false

    # PubSub
    antu.pubsub.project.id={{ .Values.gcp.pubsubProjectId }}
    spring.cloud.gcp.project-id=${antu.pubsub.project.id}

    # OAuth2 Resource Server for Entur Partner tenant
    antu.oauth2.resourceserver.auth0.entur.partner.jwt.issuer-uri={{ .Values.auth0.partner.url }}
    antu.oauth2.resourceserver.auth0.entur.partner.jwt.audience={{ .Values.auth0.partner.audience }}

    #Oauth2 Entur Partner Client
    spring.security.oauth2.client.provider.orgregister.token-uri={{ .Values.auth0.client.tokenUri }}
    spring.security.oauth2.client.registration.orgregister.client-id={{ .Values.auth0.client.clientId }}
    spring.security.oauth2.client.registration.orgregister.authorization-grant-type=client_credentials
    orgregister.oauth2.client.audience={{ .Values.auth0.client.orgregister.audience }}

    # OAuth2 Entur Internal Client
    spring.security.oauth2.client.registration.internal.authorization-grant-type=client_credentials
    spring.security.oauth2.client.registration.internal.client-id={{ .Values.auth0.internal.clientId }}
    spring.security.oauth2.client.provider.internal.token-uri={{ .Values.auth0.internal.tokenUri }}
    ror.oauth2.client.audience={{ .Values.auth0.internal.audience }}


    # Authorization
    antu.security.authorization-service=token-based
    antu.security.role.assignment.extractor={{ .Values.roleAssignmentExtractor }}
    user.permission.rest.service.url={{ .Values.baba.service }}/services/organisations/users


    # Blobstore
    blobstore.gcs.project.id={{ .Values.gcp.blobstoreProjectId }}
    blobstore.gcs.marduk.container.name={{ .Values.gcp.marduk.bucketName }}
    blobstore.gcs.antu.exchange.container.name={{ .Values.gcp.antu.exchangeBucketName }}
    blobstore.gcs.antu.container.name={{ .Values.gcp.antu.bucketName }}
    antu.netex.stop.current.filename=tiamat/CurrentAndFuture_latest.zip

    # Redis
    spring.data.redis.host=${REDIS_HOST}
    spring.data.redis.port=${REDIS_PORT}
    antu.redis.server.trust.store.file=/deployments/truststore/redis-server-ca.jks

    # Actuator
    management.endpoints.access.default=none
    management.endpoint.info.access=unrestricted
    management.endpoint.health.access=unrestricted
    management.health.defaults.enabled=false
    management.endpoint.health.group.readiness.include=readinessState
    management.endpoint.prometheus.access=unrestricted
    management.endpoints.web.exposure.include=health,prometheus,info
    management.endpoints.jmx.exposure.exclude=*


    # Logging
    logging.config=classpath:logback.xml
    logging.level.no.entur=INFO
    logging.level.no.entur.antu=INFO
    logging.level.org.apache=INFO

    # Feature flags
    interchange-waiting-time-validation-enabled={{ .Values.interchangeWaitingTimeValidationEnabled }}
    interchange-alighting-and-boarding-validation-enabled={{ .Values.alightingAndBoardingValidationEnabled }}
    interchange-service-journey-references-exist-validator-enabled={{ .Values.interchangeServiceJourneyReferencesExistValidatorEnabled }}

    # Additional allowed codespaces for Antu validation
    {{- range $index, $allowedCodespace := .Values.antu.validation.additionalAllowedCodespaces }}
    antu.validation.additional-allowed-codespaces[{{ $index }}].xmlns={{ $allowedCodespace.xmlns }}
    antu.validation.additional-allowed-codespaces[{{ $index }}].xmlnsUrl={{ $allowedCodespace.xmlnsUrl }}
    {{- end }}

    # Additional allowed organisations for Antu validation
    {{- range $index, $org := .Values.antu.validation.additionalAllowedOrganisations }}
    antu.validation.additional-allowed-organisations[{{ $index }}]={{ $org }}
    {{- end }}

    # ----------------------------------------------------------------------------------------------
    # KEPT FOR THE CAMEL-REMOVAL RELEASE ONLY. Delete this whole block in the follow-up release,
    # together with rbac.yaml, the kubernetes and stopPlaceCacheRefreshQuartzTrigger values, and the two
    # aggregation topics in terraform.
    #
    # Nothing here is read by this version: no property below matches anything it binds, and Spring
    # ignores the rest. They are here for the version being replaced.
    #
    # helm applies this ConfigMap before the first pod is replaced, and kubelet re-syncs the mounted
    # volume into pods that are still running the old jar. Any old pod that restarts during the rollout,
    # or any rollback that swaps the image without also rolling back this ConfigMap, boots the old code
    # against whatever is in this file. Without camel.cluster.kubernetes.enabled there is no
    # CamelClusterService, and MasterComponent throws "No cluster service found" on the first master:
    # route, so the CamelContext fails to start and the pod CrashLoops. Four routes use master:.
    #
    # The rest are not fatal but are not free either: antu.stop.refresh.interval defaults to
    # trigger.repeatCount=0, so dropping it does not fall back to a schedule, it stops the stop place
    # cache refreshing at all.
    spring.mvc.servlet.load-on-startup=1
    spring.task.execution.pool.core-size=32
    camel.main.name=antu
    camel.dataformat.jackson.module-refs=jacksonJavaTimeModule
    camel.dataformat.jackson.include=NON_NULL
    camel.cluster.file.enabled=false
    camel.cluster.kubernetes.enabled=true
    camel.cluster.kubernetes.cluster-labels[app]=antu
    camel.cluster.kubernetes.config-map-name=antu-leaders
    camel.main.stream-caching-enabled=false
    camel.main.stream-caching-spool-enabled=true
    camel.component.platform-http.serverRequestValidation=false
    camel.component.google-pubsub.synchronous-pull-retryable-codes=DEADLINE_EXCEEDED
    logging.level.org.apache.camel.component.http.HttpComponent=WARN
    antu.shutdown.timeout=175
    antu.camel.redelivery.max=0
    antu.organisation.refresh.interval=trigger.repeatInterval=1800000&trigger.repeatCount=-1&stateful=true
    antu.stop.refresh.interval={{ .Values.stopPlaceCacheRefreshQuartzTrigger }}
    antu.kubernetes.namespace={{ .Values.kubernetes.namespace }}
    antu.kubernetes.maxpods={{ .Values.kubernetes.maxPods }}
    # ----------------------------------------------------------------------------------------------
kind: ConfigMap
metadata:
  name: {{ template "antu.name" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "common.labels" . | indent 4 }}
