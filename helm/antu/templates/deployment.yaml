apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "antu.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "common.labels" . | indent 4 }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: antu
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "{{ .Values.service.http.internalPort }}"
        prometheus.io/scrape: "true"
      labels:
    {{- include "common.labels" . | indent 8 }}
    spec:
      serviceAccountName: application
      containers:
        - name: antu
          image: {{ .Values.image.identifier }}
          env:
            - name: JDK_JAVA_OPTIONS
              value: -Xmx{{ .Values.resources.xmx }} {{ .Values.jvmFlags }}
                {{- if .Values.monitoringEnabled}} -Dcom.sun.management.jmxremote.port=9999  -Dcom.sun.management.jmxremote.rmi.port=9998 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1
            {{- end}}
            - name: TZ
              value: Europe/Oslo
            - name: ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis-server-trust-store-password
                  name: ror-antu-secret
            - name: ANTU_REDIS_AUTHENTICATION_STRING
              valueFrom:
                secretKeyRef:
                  key: redis-authentication-string
                  name: ror-antu-secret
          envFrom:
            - configMapRef:
                name: antu-redis-configmap
            - secretRef:
                name: antu-auth-secret
            - secretRef:
                name: auth0
            - secretRef:
                name: kafka
          ports:
            - containerPort: {{ .Values.service.http.internalPort }}
              name: http
              protocol: TCP
          livenessProbe:
            # also platform-http, so a pod whose Camel mappings never registered is recycled
            # instead of silently leaving the Service; /actuator/health/liveness cannot see that
            httpGet:
              path: /services/health
              port: {{ .Values.service.http.internalPort }}
              scheme: HTTP
            initialDelaySeconds: 140
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 12
            # must stay below periodSeconds: kubelet does not serialise probes, and each in-flight
            # probe holds one of platform-http's executor threads
            timeoutSeconds: 5
          readinessProbe:
            # served by platform-http, so a pod whose Camel HTTP routes are unreachable fails
            # readiness instead of serving 404s; /actuator/health/readiness stays UP in that state
            httpGet:
              path: /services/health
              port: {{ .Values.service.http.internalPort }}
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            limits:
              memory: {{ .Values.resources.memLimit }}
            requests:
              cpu: {{ .Values.resources.cpuRequest }}
              memory: {{ .Values.resources.memRequest }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ "ALL" ]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/antu-redis-config
              name: antu-redis-config
              readOnly: true
            - mountPath: /etc/application-config
              name: application-config
              readOnly: true
            - mountPath: "/deployments/truststore"
              name: truststore
      initContainers:
        - name: antu-init-trust-store
          image: {{ .Values.image.identifier }}
          imagePullPolicy: "Always"
          env:
            - name: ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis-server-trust-store-password
                  name: ror-antu-secret
          command: [ "keytool" ]
          args: [ "-importcert", "-v", "-noprompt", "-file", "/etc/antu-redis-config/redis-server-ca.pem", "-keystore", "/deployments/truststore/redis-server-ca.jks", "-storepass", "$(ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD)" ]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ "ALL" ]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/antu-redis-config
              name: antu-redis-config
              readOnly: true
            - mountPath: "/deployments/truststore"
              name: truststore
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 180
      volumes:
        - name: application-config
          configMap:
            defaultMode: 420
            name: antu-config
        - name: antu-redis-config
          configMap:
            defaultMode: 420
            name: antu-redis-configmap
        - name: truststore
          emptyDir: { }

