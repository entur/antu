apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "antu.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "common.labels" . | indent 4 }}
  annotations:
  {{- include "common.annotations" . | indent 4 }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: antu
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "{{ .Values.service.http.internalPort }}"
        prometheus.io/scrape: "true"
      labels:
    {{- include "common.labels" . | indent 8 }}
    spec:
      serviceAccountName: application
      containers:
        - name: antu
          image: {{ .Values.image.identifier }}
          env:
            - name: JAVA_OPTS
              # In values.yaml so the docker-smoke CI job can start the image with the same flags.
              # Not JDK_JAVA_OPTIONS: see the entrypoint comment in the Dockerfile.
              value: -Xmx{{ .Values.resources.xmx }} {{ .Values.jvmFlags }}
                {{- if .Values.monitoringEnabled}} -Dcom.sun.management.jmxremote.port=9999  -Dcom.sun.management.jmxremote.rmi.port=9998 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1
            {{- end}}
            - name: TZ
              value: Europe/Oslo
            - name: ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis-server-trust-store-password
                  name: ror-antu-secret
            - name: ANTU_REDIS_AUTHENTICATION_STRING
              valueFrom:
                secretKeyRef:
                  key: redis-authentication-string
                  name: ror-antu-secret
          envFrom:
            - configMapRef:
                name: antu-redis-configmap
            - secretRef:
                name: antu-auth-secret
            - secretRef:
                name: auth0
            - secretRef:
                name: kafka
          ports:
            - containerPort: {{ .Values.service.http.internalPort }}
              name: http
              protocol: TCP
          livenessProbe:
            # A plain Spring MVC endpoint. It answers from a constant, so it reports on the HTTP
            # stack alone and never fails because Redis, GCS or PubSub are unavailable.
            httpGet:
              path: /services/health
              port: {{ .Values.service.http.internalPort }}
              scheme: HTTP
            initialDelaySeconds: 140
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 12
            # must stay below periodSeconds: kubelet does not serialise probes
            timeoutSeconds: 5
          readinessProbe:
            # Same endpoint as the liveness probe, for the same reason.
            httpGet:
              path: /services/health
              port: {{ .Values.service.http.internalPort }}
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            limits:
              memory: {{ .Values.resources.memLimit }}
            requests:
              cpu: {{ .Values.resources.cpuRequest }}
              memory: {{ .Values.resources.memRequest }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ "ALL" ]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/antu-redis-config
              name: antu-redis-config
              readOnly: true
            - mountPath: /etc/application-config
              name: application-config
              readOnly: true
            - mountPath: "/deployments/truststore"
              name: truststore
      initContainers:
        - name: antu-init-trust-store
          image: {{ .Values.image.identifier }}
          imagePullPolicy: "Always"
          env:
            - name: ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: redis-server-trust-store-password
                  name: ror-antu-secret
          # keytool writes its progress to stderr, so Cloud Logging tags every pod start ERROR. The HPA
          # starts pods all day, so keep the output for a real failure and drop it on success.
          command: [ "sh", "-c" ]
          args:
            - >-
              keytool -importcert -noprompt
              -file /etc/antu-redis-config/redis-server-ca.pem
              -keystore /deployments/truststore/redis-server-ca.jks
              -storepass "$ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD"
              >/tmp/keytool.log 2>&1 || { cat /tmp/keytool.log >&2; exit 1; }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ "ALL" ]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /etc/antu-redis-config
              name: antu-redis-config
              readOnly: true
            - mountPath: "/deployments/truststore"
              name: truststore
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      # The HPA scales antu down routinely, so pods are terminated mid-validation as normal operation, and
      # SIGKILL here means the in-flight files are redelivered and revalidated from scratch. Being above
      # antu.shutdown.drain.timeout.seconds is necessary but not sufficient: the subscriber close runs
      # before the drain and costs about 10 s per busy subscriber. Budget is 10 s x 2 consumers + the
      # 150 s drain + bean destruction, against the 180 s below.
      terminationGracePeriodSeconds: 180
      volumes:
        - name: application-config
          configMap:
            defaultMode: 420
            name: antu-config
        - name: antu-redis-config
          configMap:
            defaultMode: 420
            name: antu-redis-configmap
        - name: truststore
          emptyDir: { }

