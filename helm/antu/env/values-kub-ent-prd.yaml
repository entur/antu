common:
  env: prd
  ingress:
    host: timetable-validation-v1-validation-gcp2.entur.io
  # Thresholds explained in values.yaml under common.hpa. project_id must match gcp.pubsubProjectId.
  hpa:
    spec:
      metrics:
        - type: External
          external:
            metric:
              name: pubsub.googleapis.com|subscription|num_undelivered_messages
              selector:
                matchLabels:
                  resource.labels.project_id: ent-antu-prd
                  resource.labels.subscription_id: AntuJobQueue
            target:
              type: AverageValue
              averageValue: "5"
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70

antu:
  validation:
    additionalAllowedCodespaces:
      - xmlns: NSR
        xmlnsUrl: http://www.rutebanken.org/ns/nsr
      - xmlns: PEN
        xmlnsUrl: http://www.rutebanken.org/ns/pen
    additionalAllowedOrganisations: []

gcp:
  blobstoreProjectId: entur-ror-prod
  pubsubProjectId: ent-antu-prd

  marduk:
    bucketName: marduk-production

  antu:
    bucketName: ror-antu-gcp2-production
    exchangeBucketName: ror-antu-exchange-gcp2-production

tiamatUrl: http://tiamat.prd.entur.internal/services/stop_places

agreementRegistryUrl: https://api.entur.io/agreements/v1

vehicleRegistryUrl: https://api.entur.io/vehicles/v1

interchangeWaitingTimeValidationEnabled: true
alightingAndBoardingValidationEnabled: true
interchangeServiceJourneyReferencesExistValidatorEnabled: true
netexValidationVehiclesEnabled: false

baba:
