# Entur common chart, https://github.com/entur/helm-charts/tree/main/charts/common
# Everything under common is chart input. Everything else is read by templates/configmap.yaml.
common:
  app: antu
  appId: antu
  team: ror
  labels:
    customLogRetention: enabled
    slack: talk-ror
    type: backend

  container:
    # Replaced at deploy time by gha-helm (--set common.container.image).
    image: antu
    # -Xmx has to leave room for everything the JVM allocates outside the heap: metaspace, code cache,
    # thread stacks, GC structures and the direct buffers gRPC and Netty use for PubSub and GCS. At
    # 2500m against a 3000Mi limit that was about 500Mi, so the container was OOM-killed by the kernel
    # before the heap ever reached its ceiling - which is why ExitOnOutOfMemoryError never fired and the
    # restarts left no log line at all. Keep the gap at roughly a quarter of the limit: -Xmx is the first
    # flag in configmap.data.JAVA_OPTS below. The chart sets the memory limit equal to the request and no
    # CPU limit.
    cpu: 1.5
    memory: 4096
    prometheus:
      enabled: true
    env:
      - name: ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD
        valueFrom:
          secretKeyRef:
            key: redis-server-trust-store-password
            name: ror-antu-secret
      - name: ANTU_REDIS_AUTHENTICATION_STRING
        valueFrom:
          secretKeyRef:
            key: redis-authentication-string
            name: ror-antu-secret
    envFrom:
      - configMapRef:
          name: antu-redis-configmap
      - secretRef:
          name: auth0
    probes:
      # Literal spec because the chart's probe helper has no timeoutSeconds. Keep timeoutSeconds below
      # periodSeconds: kubelet does not serialise probes.
      spec:
        livenessProbe:
          # A plain Spring MVC endpoint. It answers from a constant, so it reports on the HTTP
          # stack alone and never fails because Redis, GCS or PubSub are unavailable.
          httpGet:
            path: /services/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 140
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 12
          timeoutSeconds: 5
        readinessProbe:
          # Same endpoint as the liveness probe, for the same reason.
          httpGet:
            path: /services/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 5
    volumeMounts:
      - mountPath: /etc/antu-redis-config
        name: antu-redis-config
        readOnly: true
      - mountPath: /etc/application-config
        name: application-config
        readOnly: true
      - mountPath: /deployments/truststore
        name: truststore

  # Environment for the container. A ConfigMap rather than container.env so that the env values files
  # can add keys (JAVA_OPTS_EXTRA) without repeating the list. The chart adds no checksum annotation, so
  # a change here rolls the pods only because every deploy also changes the image tag.
  configmap:
    enabled: true
    data:
      TZ: Europe/Oslo
      # -Xmx: see container.memory.
      #
      # ExitOnOutOfMemoryError: otherwise an OOME kills only the validating thread and the pod stays Ready
      # and keeps leasing jobs it cannot finish.
      #
      # sun-misc-unsafe-memory-access: load-bearing on JDK 24 and later. Kryo's FieldSerializer calls
      # Unsafe.objectFieldOffset, and Kryo is the codec for every Redis structure the pipeline runs on: the
      # validation state, the barrier arrival sets, the temporary files. JDK 25 still defaults to warn, so
      # without this the pods work until a base image bump flips the default to deny, and then no pod can
      # read or write Redis at all. Verified on 25.0.4: records survive deny, plain POJOs do not.
      #
      # Read by the docker-smoke job in .github/workflows/push.yml, which is the only thing in CI that
      # starts the image. Keep it here rather than inline elsewhere, or that gate goes stale.
      JAVA_OPTS: >-
        -Xmx3000m -Xms128m -Xss512k -XX:ActiveProcessorCount=2
        -XX:+ExitOnOutOfMemoryError
        -XX:+IgnoreUnrecognizedVMOptions
        --enable-native-access=ALL-UNNAMED
        --sun-misc-unsafe-memory-access=allow
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
        -Dspring.config.location=/etc/application-config/application.properties
        -Dfile.encoding=UTF-8
      # Appended after JAVA_OPTS by the Dockerfile entrypoint. Set in env/values-kub-ent-*.yaml.
      JAVA_OPTS_EXTRA: ""

  # ExternalSecrets named antu-<key>, mounted with envFrom by the chart.
  secrets:
    auth:
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ORGREGISTER_CLIENT_SECRET
    kafka:
      - KAFKAPASSWORD
      - KAFKAUSERNAME

  initContainers:
    - name: antu-init-trust-store
      # Same base image as the Dockerfile: it has sh and keytool. gha-helm cannot --set a list element,
      # so this is not the application image. Renovate bumps the tag and digest with the Dockerfile.
      image: bellsoft/liberica-openjre-alpine:25.0.4.1@sha256:33b92304b3abdad54fb937224adcab07febad199180867d51be0fcd9da340ee4
      imagePullPolicy: IfNotPresent
      env:
        - name: ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: redis-server-trust-store-password
              name: ror-antu-secret
      # keytool writes its progress to stderr, so Cloud Logging tags every pod start ERROR. The HPA
      # starts pods all day, so keep the output for a real failure and drop it on success.
      command: [ "sh", "-c" ]
      args:
        - >-
          keytool -importcert -noprompt
          -file /etc/antu-redis-config/redis-server-ca.pem
          -keystore /deployments/truststore/redis-server-ca.jks
          -storepass:env ANTU_REDIS_SERVER_TRUST_STORE_PASSWORD
          >/tmp/keytool.log 2>&1 || { cat /tmp/keytool.log >&2; exit 1; }
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: [ "ALL" ]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /etc/antu-redis-config
          name: antu-redis-config
          readOnly: true
        - mountPath: /deployments/truststore
          name: truststore

  deployment:
    # Read by the PDB only; the HPA takes hpa.spec below.
    minReplicas: 2
    # The old chart set spec.replicas and this one leaves it to the HPA, so the first upgrade deletes
    # the field and the API server defaults it to 1 until the HPA's next sync. With 0 here the controller
    # keeps an old pod until a new one is Ready instead of taking the whole fleet down at once. A string
    # because the chart runs the value through default 1, which treats the integer 0 as unset.
    maxUnavailable: "0%"
    volumes:
      - name: application-config
        configMap:
          defaultMode: 420
          name: antu-config
      - name: antu-redis-config
        configMap:
          defaultMode: 420
          name: antu-redis-configmap
      - name: truststore
        emptyDir: { }
    # The HPA scales antu down routinely, so pods are terminated mid-validation as normal operation, and
    # SIGKILL here means the in-flight files are redelivered and revalidated from scratch. Being above
    # antu.shutdown.drain.timeout.seconds is necessary but not sufficient: the subscriber close runs
    # before the drain and costs about 10 s per busy subscriber. Budget is 10 s x 2 consumers + the
    # 150 s drain + bean destruction, against the 180 s below.
    terminationGracePeriodSeconds: 180

  # Full HPA spec. The metrics list is per environment (env/values-kub-ent-*.yaml): the chart does not run
  # tpl on values, so project_id cannot come from gcp.pubsubProjectId. The three copies differ only in
  # project_id. What the metrics mean:
  #
  # AntuJobQueue averageValue: queued jobs per pod before another pod is added. Each pod runs jobConsumers
  # validations at a time, so this is the queue depth one pod is expected to absorb. This was 0.1, which
  # means a single queued message asks for maxReplicas. Measured in dev: the backlog is zero most of the
  # time and spikes to 47-137 when a dataset fans out into line files, so the fleet oscillated between
  # min and max all morning - 20 JVM starts in 37 minutes, including 8 pods stopped and 8 started within
  # four minutes. At 5 the small spikes are absorbed by the pods already running and a real fan-out still
  # reaches maxReplicas.
  #
  # CPU averageUtilization: a validating pod uses more than a core against a 1500m request, so at 10 this
  # metric on its own asked for maxReplicas whenever anything was running, whatever the queue looked
  # like. The HPA scales on the highest of its metrics, so this has to be sane or the queue metric has no
  # effect.
  hpa:
    spec:
      minReplicas: 2
      maxReplicas: 10
      behavior:
        scaleUp:
          # Immediately, and as many as needed: the work is already queued and waiting, and a line file
          # fan-out arrives all at once.
          policies:
            - type: Pods
              value: 10
              periodSeconds: 15
          stabilizationWindowSeconds: 0
        scaleDown:
          # Slowly, and only once the backlog has stayed low. Scaling down costs more than scaling up: a
          # pod stopped mid-validation holds shutdown open for the drain, and anything it does not finish
          # is redelivered and revalidated. Validations run for minutes and the stages of one import are a
          # minute or two apart, so a short window tears the fleet down between stages and rebuilds it.
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
          stabilizationWindowSeconds: 300

  service:
    externalPort: 8080
    internalPort: 8080

  ingress:
    trafficType: api

# Read only by the Camel-era keys kept in the ConfigMap for the removal release. Delete with them.
kubernetes:
  namespace: antu
  maxPods: 10

# How often the leader checks the bucket for a new stop place export.
# Spring cron: second minute hour day-of-month month day-of-week.
#
# Not the export schedule: Tiamat writes twice a day, and this used to be an hour off it in both
# directions, which left the cache up to 26 hours behind. A check is one blob metadata read, so the
# schedule no longer has to guess right. It is also how often a failed refresh is retried, which is
# why it is not shorter.
stopPlaceCacheRefreshCron: 0 */15 * * * *

# The same schedule as a quartz trigger URI, for the version being replaced. Delete with the Camel-era
# ConfigMap keys.
stopPlaceCacheRefreshQuartzTrigger: ?cron=0+0+01,14+?+*+*

# Validations one pod runs at a time. Bounds heap: each one holds a whole NeTEx file.
jobConsumers: 1
