image:
  identifier: <+artifacts.primary.image>
  imagePullPolicy: Always

service:
  http:
    externalPort: 8080
    internalPort: 8080

resources:
  memLimit: 3000Mi
  cpuRequest: 1500m
  memRequest: 3000Mi
  xmx: 2500m

horizontalPodAutoscaler:
  maxReplicas: 10
  minReplicas: 2
  # Queued jobs per pod before another pod is added. Each pod runs jobConsumers validations at a time,
  # so this is the queue depth one pod is expected to absorb.
  #
  # This was 0.1, which means a single queued message asks for maxReplicas. Measured in dev: the backlog
  # is zero most of the time and spikes to 47-137 when a dataset fans out into line files, so the fleet
  # oscillated between min and max all morning - 20 JVM starts in 37 minutes, including 8 pods stopped
  # and 8 started within four minutes. At 5 the small spikes are absorbed by the pods already running and
  # a real fan-out still reaches maxReplicas.
  messagesPerPod: 5
  # A validating pod uses more than a core against a 1500m request, so at 10 this metric on its own asked
  # for maxReplicas whenever anything was running, whatever the queue looked like. The HPA scales on the
  # highest of its metrics, so this has to be sane or messagesPerPod above has no effect.
  targetCPUUtilizationPercentage: 70

# -Xmx is prepended by the deployment from resources.xmx.
#
# ExitOnOutOfMemoryError: otherwise an OOME kills only the validating thread and the pod stays Ready and
# keeps leasing jobs it cannot finish.
#
# sun-misc-unsafe-memory-access: load-bearing on JDK 24 and later. Kryo's FieldSerializer calls
# Unsafe.objectFieldOffset, and Kryo is the codec for every Redis structure the pipeline runs on: the
# validation state, the barrier arrival sets, the temporary files. JDK 25 still defaults to warn, so
# without this the pods work until a base image bump flips the default to deny, and then no pod can read
# or write Redis at all. Verified on 25.0.4: records survive deny, plain POJOs do not.
#
# Read by the docker-smoke job in .github/workflows/push.yml, which is the only thing in CI that starts
# the image. Keep them here rather than inline in the deployment, or that gate goes stale.
jvmFlags: >-
  -Xms128m -Xss512k -XX:ActiveProcessorCount=2
  -XX:+ExitOnOutOfMemoryError
  -XX:+IgnoreUnrecognizedVMOptions
  --enable-native-access=ALL-UNNAMED
  --sun-misc-unsafe-memory-access=allow
  --add-opens=java.base/java.nio=ALL-UNNAMED
  --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
  -Dspring.config.location=/etc/application-config/application.properties
  -Dfile.encoding=UTF-8

# Read only by the Camel-era keys kept in the ConfigMap for the removal release. Delete with them.
kubernetes:
  namespace: antu
  maxPods: 10

secrets:
  antu-auth-secret:
    - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_ORGREGISTER_CLIENT_SECRET
  kafka:
    - KAFKAPASSWORD
    - KAFKAUSERNAME

# How often the leader checks the bucket for a new stop place export.
# Spring cron: second minute hour day-of-month month day-of-week.
#
# Not the export schedule: Tiamat writes twice a day, and this used to be an hour off it in both
# directions, which left the cache up to 26 hours behind. A check is one blob metadata read, so the
# schedule no longer has to guess right. It is also how often a failed refresh is retried, which is
# why it is not shorter.
stopPlaceCacheRefreshCron: 0 */15 * * * *

# The same schedule as a quartz trigger URI, for the version being replaced. Delete with the Camel-era
# ConfigMap keys.
stopPlaceCacheRefreshQuartzTrigger: ?cron=0+0+01,14+?+*+*

# Validations one pod runs at a time. Bounds heap: each one holds a whole NeTEx file.
jobConsumers: 1